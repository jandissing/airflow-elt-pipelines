[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["error::FutureWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "logs", "output"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# DAG files must extend sys.path before importing the local elt package, because
# Airflow 3 task workers don't inherit PYTHONPATH - so those imports cannot sit
# at the top of the file.
"dags/*.py" = ["E402"]
