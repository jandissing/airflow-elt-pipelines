# Shared configuration for the two Airflow services (webserver + scheduler).
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  image: local-airflow-elt:3.3.0
  environment: &airflow-env
    AIRFLOW_HOME: /opt/airflow
    PYTHONPATH: /opt/airflow
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN:?set it in .env}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:?set it in .env}
    # [api] secret_key is the Airflow 3 name; [webserver] secret_key is still
    # read by the FAB auth manager for Flask sessions, so both are set.
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW__API__SECRET_KEY:?set it in .env}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__API__SECRET_KEY:?set it in .env}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:?set it in .env}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://webserver:8080/execution/"
    # Warehouse credentials read by the elt package (elt/config.py)
    POSTGRES_USER: ${POSTGRES_USER:-airflow_user}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
    POSTGRES_DB: ${POSTGRES_DB:-airflow_db}
    DB_HOST: ${DB_HOST:-postgres}
    DB_PORT: ${DB_PORT:-5432}
  volumes:
    - .:/opt/airflow
    - ./logs:/opt/airflow/logs
    - ./output:/opt/airflow/output
  networks:
    - airflow-network

services:
  postgres:
    image: postgres:15-alpine
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      POSTGRES_DB: ${POSTGRES_DB:-airflow_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airflow_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - airflow-network

  webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    command: >
      bash -c "airflow db migrate &&
               airflow users create -r Admin -u admin -e admin@example.com -f Admin -l User -p ${AIRFLOW_ADMIN_PASSWORD:-admin} 2>/dev/null || true &&
               airflow api-server"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v2/monitor/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    depends_on:
      webserver:
        condition: service_healthy
    command: airflow scheduler

volumes:
  postgres_data:

networks:
  airflow-network:
    driver: bridge
